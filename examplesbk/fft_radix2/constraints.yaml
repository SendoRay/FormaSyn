# examples/fft_radix2/constraints.yaml

hardware_constraints:
  target_device: "xcu200-fsgd2104-2-e"
  clock_target_mhz: 250
  max_dsp: 32
  max_bram_18k: 16
  target_ii: 1

algorithm_metrics:
  evaluator_type: "WaveformEvaluator"
  kernel_type: "transform"
  tolerance:
    nmse_db: -50.0
    max_overflows: 0
