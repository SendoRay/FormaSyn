# examples/timing_recovery/constraints.yaml

hardware_constraints:
  target_device: "xcu200-fsgd2104-2-e"
  clock_target_mhz: 200
  max_dsp: 8
  max_bram_18k: 4
  target_ii: 1

algorithm_metrics:
  evaluator_type: "WaveformEvaluator"
  kernel_type: "synchronization"
  tolerance:
    nmse_db: -30.0
    timing_jitter_ui: 0.05
